name: Test and deploy to GCP

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: escape-plan-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: pip install -r backend/requirements.lock

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run backend tests
        env:
          PYTHONPATH: backend
        run: python -m pytest backend/tests -q

      - name: Build frontend
        run: npm run build --prefix frontend

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure deployment SSH key
        env:
          DEPLOY_PRIVATE_KEY: ${{ secrets.GCP_DEPLOY_PRIVATE_KEY }}
          GCP_VM_HOST: ${{ secrets.GCP_VM_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" > ~/.ssh/escape-plan-deploy
          chmod 600 ~/.ssh/escape-plan-deploy

          ssh-keyscan -T 10 -t ed25519 "$GCP_VM_HOST" \
            > ~/.ssh/known_hosts 2>/dev/null
          host_fingerprint="$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk '{print $2}')"
          expected_fingerprint="SHA256:F3QtwwpG/JtkU7rG2a7OBET7L2QvirPxXBjte/3HPCc"
          if [[ "$host_fingerprint" != "$expected_fingerprint" ]]; then
            echo "The VM SSH host key does not match the pinned fingerprint." >&2
            exit 1
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy the tested commit
        env:
          GCP_VM_HOST: ${{ secrets.GCP_VM_HOST }}
        run: |
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/escape-plan-deploy" \
            "deploy@$GCP_VM_HOST" \
            "deploy $GITHUB_SHA"
